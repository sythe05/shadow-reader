services:
  neo4j:
    image: neo4j:5-community
    container_name: shadow-reader-neo4j
    restart: unless-stopped
    ports:
      - "7474:7474"   # browser UI
      - "7687:7687"   # bolt
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-shadowreader123}
    volumes:
      - neo4j_data:/data

volumes:
  neo4j_data:
